# Weekly dependency updates. Each ecosystem's updates come grouped in one PR.
version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/docker/api", "/docker/web"]
    schedule:
      interval: weekly
    # Runtime versions are a project decision (Node 24 LTS, Python 3.14), not a routine update.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      dockerfiles:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: ["/docker/postgres", "/docker/redis"]
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
