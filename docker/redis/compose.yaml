# Redis 8: rate limits, cache, background jobs, and the reply stream buffer.
# Local only: no password. Deployment must add one.
services:
  redis:
    image: redis:8-alpine
    container_name: chatgpt-redis
    ports:
      - "127.0.0.1:6379:6379" # this machine only, not the network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
