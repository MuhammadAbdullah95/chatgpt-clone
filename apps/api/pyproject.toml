[project]
name = "chatgpt-clone-api"
version = "0.1.0"
description = "FastAPI backend for the ChatGPT clone"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "UP",       # modern Python syntax
    "B",        # likely bugs
    "SIM",      # simpler code
    "ASYNC",    # blocking calls inside async code
    "S",        # security (bandit)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
